
name: Assignment Earn APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android App
        run: |
          mkdir -p app/src/main/java/com/assignmentearn/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AssignmentEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.assignmentearn.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.assignmentearn.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Assignment Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/assignmentearn/app/MainActivity.java <<'EOF'
          package com.assignmentearn.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {

              WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, String url) {
                          return handleUrl(url);
                      }

                      private boolean handleUrl(String url) {
                          Uri uri = Uri.parse(url);
                          String host = uri.getHost() == null ? "" : uri.getHost();

                          if (("https".equals(uri.getScheme()) ||
                               "http".equals(uri.getScheme())) &&
                              (host.equals("assignmentearn.com") ||
                               host.endsWith(".assignmentearn.com"))) {
                              return false;
                          }

                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {}

                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://assignmentearn.com/user/login");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Generate Original App Logo Icons
        run: |
          python -m pip install pillow

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assignment-earn-app-icon.png")

          if not source.exists():
              raise FileNotFoundError(
                  "assignment-earn-app-icon.png missing from repository root"
              )

          original = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              output_dir = Path("app/src/main/res") / folder
              output_dir.mkdir(parents=True, exist_ok=True)

              image = Image.new("RGBA", (size, size), (0, 0, 0, 255))

              logo = original.copy()
              logo.thumbnail(
                  (int(size * 0.90), int(size * 0.90)),
                  Image.Resampling.LANCZOS
              )

              x = (size - logo.width) // 2
              y = (size - logo.height) // 2

              image.alpha_composite(logo, (x, y))
              image.save(output_dir / "ic_launcher.png")

          print("Assignment Earn original logo icons generated!")
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-Earn-APK
          path: app/build/outputs/apk/debug/app-debug.apk
